<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 108 108" role="img" aria-label="studyzflow">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4338CA"/>
      <stop offset="1" stop-color="#8B5CF6"/>
    </linearGradient>
  </defs>
  <rect width="108" height="108" rx="26" fill="url(#bg)"/>
  <g transform="translate(54 54) scale(1.3) translate(-54 -54)" fill="none" stroke="#fff" stroke-width="7" stroke-linecap="round" stroke-linejoin="round">
    <!-- open progress ring -->
    <path d="M75.67,50.18 A22,22 0 1 1 57.82,32.33"/>
    <!-- flow arrowhead -->
    <path d="M64.7,33.5 L56.78,38.24 L58.86,26.42 Z" fill="#fff" stroke-width="2"/>
    <!-- check sweeping out of the ring -->
    <path d="M42,55 L50,63 L72,38"/>
  </g>
</svg>
